services:
  - type: web
    name: techfix-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TZ
        value: America/Guayaquil
      - key: DATABASE_URL
        fromDatabase:
          name: techfix-db
          property: connectionString
      - key: TECHFIX_ADMIN_EMAIL
        sync: false
      - key: TECHFIX_ADMIN_PASSWORD
        sync: false

databases:
  - name: techfix-db
    plan: free
    ipAllowList: []
